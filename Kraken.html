<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Kraken Monitor Damien</title>
<style>
body {
  margin:0; background:#0a0a0a; color:white;
  font-family:"Arial Black",sans-serif;
  display:flex; flex-direction:column;
  justify-content:space-around; align-items:center;
  width:320px; height:320px;
}
.section { text-align:center; }
.title { font-size:18px; opacity:0.7; }
.value { font-size:52px; font-weight:bold; }
.logo { width:50px; height:50px; display:block; margin:0 auto 5px; }
.cpu .value { color:#ff4d4d; text-shadow:2px 2px 5px #600;}
.gpu .value { color:#4d94ff; text-shadow:2px 2px 5px #006;}
</style>
</head>
<body>

<div class="section cpu">
  <img src="https://img.icons8.com/ios-filled/50/ffffff/cpu.png" class="logo">
  <div class="title">CPU</div>
  <div class="value" id="cpuTemp">-- °C</div>
  <div class="value" id="cpuLoad">-- %</div>
</div>

<div class="section gpu">
  <img src="https://img.icons8.com/ios-filled/50/ffffff/graphics-card.png" class="logo">
  <div class="title">GPU</div>
  <div class="value" id="gpuTemp">-- °C</div>
  <div class="value" id="gpuLoad">-- %</div>
</div>

<script>
window.nzxt = {
  v1: {
    onMonitoringDataUpdate: (data) => {
      try {
        const cpu = data.cpus?.[0];   
        const gpu = data.gpus?.[0];

        if(cpu){
          document.getElementById("cpuTemp").innerText = cpu.temperature?.current ?? "--" + " °C";
          document.getElementById("cpuLoad").innerText = cpu.load?.current ?? "--" + " %";
        }
        if(gpu){
          document.getElementById("gpuTemp").innerText = gpu.temperature?.current ?? "--" + " °C";
          document.getElementById("gpuLoad").innerText = gpu.load?.current ?? "--" + " %";
        }
      } catch(e) {
        console.log("Erreur données CAM", e);
      }
    }
  }
};
</script>

</body>
</html>
